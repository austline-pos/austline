name: austline_pos
description: "A Point of Sale application for Austline Cafe & Bakery."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Cloud Database
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Local Database & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Utilities, Image Picker & Bluetooth Printer
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  intl: ^0.19.0
  print_bluetooth_thermal: ^1.1.0
  permission_handler: ^11.3.1
  file_picker: ^13.1.0

  # Tambahan untuk konversi gambar dan format cetak thermal ESC/POS
  esc_pos_utils_plus: ^2.0.2
  image: ^4.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_austline.png
    - assets/images/austline.png
    - assets/images/Icon_apk.png

flutter_launcher_icons:
  image_path: "assets/images/Icon_apk.png"
  android: true
  ios: true